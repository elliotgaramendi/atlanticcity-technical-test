<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pokedex | Atlantic City</title>
    <style>
      html {
        background: #020617;
      }

      body {
        margin: 0;
      }

      .app-loader {
        align-items: center;
        background:
          radial-gradient(circle at 50% 30%, rgba(14, 165, 233, 0.22), transparent 32%),
          linear-gradient(180deg, #020617 0%, #071426 100%);
        color: #e0f2fe;
        display: flex;
        font-family:
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        justify-content: center;
        min-height: 100dvh;
      }

      .app-loader__content {
        align-items: center;
        display: flex;
        flex-direction: column;
        gap: 1rem;
        padding: 2rem;
        text-align: center;
      }

      .app-loader__ball {
        animation: app-loader-pulse 1.4s ease-in-out infinite;
        background: linear-gradient(135deg, #0ea5e9, #60a5fa);
        border: 0.25rem solid rgba(224, 242, 254, 0.95);
        border-radius: 9999px;
        box-shadow: 0 1.25rem 3rem rgba(14, 165, 233, 0.3);
        height: 3.5rem;
        position: relative;
        width: 3.5rem;
      }

      .app-loader__ball::before {
        background: rgba(224, 242, 254, 0.95);
        content: "";
        height: 0.25rem;
        left: 0;
        position: absolute;
        right: 0;
        top: 50%;
        transform: translateY(-50%);
      }

      .app-loader__ball::after {
        background: #020617;
        border: 0.2rem solid rgba(224, 242, 254, 0.95);
        border-radius: 9999px;
        content: "";
        height: 0.85rem;
        left: 50%;
        position: absolute;
        top: 50%;
        transform: translate(-50%, -50%);
        width: 0.85rem;
      }

      .app-loader__title {
        font-size: 1.125rem;
        font-weight: 800;
        letter-spacing: 0.02em;
        margin: 0;
      }

      .app-loader__subtitle {
        color: #93c5fd;
        font-size: 0.75rem;
        font-weight: 700;
        letter-spacing: 0.3em;
        margin: 0;
        text-transform: uppercase;
      }

      @keyframes app-loader-pulse {
        0%,
        100% {
          transform: translateY(0) scale(1);
        }

        50% {
          transform: translateY(-0.35rem) scale(1.04);
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="app-loader" role="status" aria-live="polite">
        <div class="app-loader__content">
          <div class="app-loader__ball" aria-hidden="true"></div>
          <div>
            <p class="app-loader__title">Pokedex</p>
            <p class="app-loader__subtitle">Atlantic City</p>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
